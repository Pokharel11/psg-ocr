# P.S.G. & Associates — OCR Docs wording (Nepali). Read by the OCR builder
# (assets/js/ocr-core.js) and the Node tests. ALL wording here is either a spelling
# correction (A3) or new text (A2 variants + Part C letters); it is pending partner
# confirmation, so verified: false. Names hold the name only — templates add
# श्री / सि.ए. / ज्यू. Placeholders are {curly}.
meta:
  verified: false

roles: ["अध्यक्ष", "प्रबन्ध सञ्चालक", "सञ्चालक", "स्वतन्त्र सञ्चालक"]

# Auditor-change reasons: stored as complete phrases (को attaches, no space),
# used verbatim in the SGM minute and the C2 letter.
reasons:
  - key: "कार्यव्यस्तता"
    label: "कार्यव्यस्तता (व्यस्त)"
    phrase: "कार्यव्यस्तताको कारण"
  - key: "राजीनामा"
    label: "राजीनामा"
    phrase: "राजीनामा दिनुभएको कारण"

defaults:
  times: { sgmBod: "११.०० बजे", sgm: "११.०० बजे", agmBod: "दिउँसो १ बजे", agm: "बिहान १० बजे" }
  faceValue: 100
  loans: "नभएको"
  investments: "छैन"
  brokerage: "छैन"
  forfeited: "छैन"
  sec92: "छैन"     # default for items क, ख, ग, घ for every director
  # No default auditor title — titles are never assumed (not every auditor is a CA).
  # PSG partners carry their own title (सी.ए.) in the firm block below.

# The firm, for the auditor "firm selector" quick-fill (this year / next year /
# new auditor on change). Selecting PSG fills the firm, address and a partner.
firm:
  name: "पी.एस.जी. एण्ड एसोसिएट्स"
  address: "मध्य बानेश्वर, काठमाडौँ"
  partners:
    - { name: "गौरव पोखरेल", title: "सी.ए.", designation: "साझेदार" }
    - { name: "सुजन तिमल्सिना", title: "सी.ए.", designation: "साझेदार" }

labels:
  regNo: "कम्पनी दर्ता नं: {reg}"
  attendance: "उपस्थिति"
  attendanceColon: "उपस्थिति :"
  proposals: "प्रस्तावहरू"
  proposalsDiscuss: "छलफलका प्रस्तावहरू"
  decisions: "निर्णयहरू"
  tapsil: "तपसिल"
  place: "स्थान :     {place}"
  date: "मिति :-     {date}"
  time: "समय :-     {time}"
  madhoday: "महोदय,"
  bhabadiya: "भवदीय,"
  dottedLine: "....................................."

# Attendance (shareholders) and directors-table column headers
tables:
  attendance: ["क्र.सं.", "नाम", "पद", "हस्ताक्षर"]
  shareholders: ["क्र.सं.", "नाम", "ठेगाना", "शेयर संख्या"]
  directors51: ["क्र.सं.", "नाम थर", "पद", "ठेगाना"]
  bo: ["क्र.सं.", "शेयरधनीको नाम", "शेयरधनीको ठेगाना", "वास्तविक धनीको नाम", "वास्तविक धनीको ठेगाना", "वास्तविक धनीको नागरिकता नं.", "धारण गरेको शेयर प्रतिशत", "कैफियत"]

headings:
  sgmBod: "सञ्चालक समितिको बैठक"
  sgm: "विशेष साधारण सभाको बैठक"
  bo: "वास्तविक धनी (Beneficiary Owner) सम्बन्धी विवरण"
  boSub: "(कम्पनी ऐन, २०६३ तथा सम्पत्ति शुद्धीकरण (मनी लाउन्डरिङ) निवारण ऐन, २०६४ को व्यवस्था अनुसार)"
  agmBod: "सञ्चालक समितिको निर्णय"
  agm: "वार्षिक साधारण सभाको निर्णय"
  sec92: "कम्पनी ऐन, २०६३ को दफा ९२ को विवरण"
  s51a: "कम्पनी रजिष्ट्रारको कार्यालयमा पेश गर्नुपर्ने"
  s51b: "कम्पनी ऐन, २०६३ को दफा ५१ बमोजिमको"
  s51c: "शेयर, डिबेञ्चर र ऋणको लगत"

# ── SGM-call BOD minute (auditor change only) ──
sgmBod:
  intro: "{company} को सञ्चालक समितिको बैठक श्री {chair} को अध्यक्षतामा, निम्न स्थान, मिति र समयमा, निम्नलिखित व्यक्तिहरूको उपस्थितिमा बसी देहायका विषयमा, देहायका निर्णयहरू पारित गरियो ।"
  prop1: "(१)   विशेष साधारण सभा बोलाउने सम्बन्धमा ।"
  prop2: "(२)   अन्य ।"
  dec1Head: "निर्णय नं. १"
  dec1: "यस कम्पनीको विशेष साधारण सभा मिति {sgm} गतेका दिन कम्पनीको कार्यालयमा बस्ने र सो साधारण सभामा तपसिल विषयहरूमा छलफल गर्ने निर्णय सर्वसम्मतिबाट पारित गरियो । साथै साधारण सभा बस्ने मिति, स्थान र समयका बारेमा कम्पनीका सम्पूर्ण शेयरधनीहरूलाई सूचना गर्ने निर्णय गरियो ।"
  dec1a: "(१) लेखापरीक्षक परिवर्तन गर्ने ।"
  dec1b: "(२) अन्य ।"
  dec2Head: "निर्णय नं. २"
  dec2: "अन्य विषय नरहेकाले बैठक यत्तिमै सकियो ।"

# ── SGM minute (auditor change only) ──
sgm:
  intro: "{company} को विशेष साधारण सभाको बैठक श्री {chair} को अध्यक्षतामा, निम्न स्थान, मिति र समयमा, निम्नलिखित व्यक्तिहरूको उपस्थितिमा बसी देहायका विषयमा, देहायका निर्णयहरू पारित गरियो ।"
  prop1: "(१) लेखापरीक्षक परिवर्तन गर्ने ।"
  prop2: "(२) अन्य ।"
  legalityHead: "सभाको वैधानिकता"
  legality: "आजको यस सभा वैधानिक भए नभएको सम्बन्धमा छलफल गर्दा यस सभामा गणपूरक संख्या पुगी सभा वैधानिक भएकोले अध्यक्ष ज्यूले सभाको कारबाही अगाडि बढाउन निर्देशन दिनुभयो ।"
  dec1Head: "निर्णय नं. १"
  dec1: "साधारण सभाले नियुक्त गरेको आ.व. {fy} को लेखापरीक्षक {prevFirm} का श्री {prevAuditor} को {reason} विशेष साधारण सभाले लेखापरीक्षक परिवर्तन गरी लेखापरीक्षक {curFirm} का श्री {curAuditor} लाई लेखापरीक्षकको रूपमा नियुक्त गरेको छ ।"
  dec2Head: "निर्णय नं. २"
  dec2: "अन्य विषय नरहेकाले बैठक यत्तिमै सकियो ।"

# ── Beneficiary Owner detail ──
bo:
  line1: "१) कम्पनीका कुन शेयरधनीको अन्य वास्तविक धनी नभएको भनी सो शेयरधनीले स्वघोषणा गरेको भएमा सो उल्लेख गर्नुहोस् (तल नं. २ भर्नु पर्दैन)"
  line1b: "कम्पनीका कुनै शेयरधनीको अन्य वास्तविक धनी नभएको स्वघोषणा गर्दछु ।"
  line2: "२) सम्बन्धित शेयरधनीले घोषणा गरेको अनुसार अन्य वास्तविक धनी भएमा शेयरधनीको विवरण:"
  note: "नोट: कुनै शेयरधनीको एकभन्दा बढी वास्तविक धनी भएमा क्रमशः उल्लेख गर्ने ।"

# ── AGM-call BOD minute ──
agmBod:
  intro: "आज मिति {date} गते {time} यस कम्पनीको सञ्चालक समितिको बैठक यस कम्पनीका अध्यक्ष श्री {chair} को अध्यक्षतामा बैठक बसी तपसिल बमोजिमको महानुभावको उपस्थितिमा निम्नानुसारको निर्णय गरियो ।"
  prop1: "१. वार्षिक साधारण सभा बोलाउने सम्बन्धमा ।"
  prop2: "२. विविध ।"
  dec1Head: "निर्णय नं. १ वार्षिक साधारण सभा बोलाउने सम्बन्धमा:"
  dec1: "प्रस्ताव नं. १ माथि छलफल गर्दा यस कम्पनीको साधारण सभा मिति {agm} गतेका दिन कम्पनीको रजिष्टर्ड कार्यालयमा {agmTime} र सो सभामा तपसिल बमोजिमको विषयहरूमा छलफल गर्ने निर्णय सर्वसम्मतिबाट गरियो ।"
  tapsilA: "क) सञ्चालक समितिको वार्षिक प्रतिवेदन उपर छलफल गर्ने सम्बन्धमा ।"
  tapsilB: "ख) आ.व. {fy} को वार्षिक लेखापरीक्षण प्रतिवेदन एवं नाफा नोक्सान हिसाब, वासलात आदि माथि छलफल सम्बन्धमा ।"
  tapsilC: "ग) आ.व. {nextFy} को लागि लेखापरीक्षक नियुक्ति गर्ने सम्बन्धमा ।"
  tapsilD: "घ) विविध"
  dec2Head: "निर्णय नं. २. विविधः"
  dec2: "प्रस्ताव नं. २ माथि छलफल गर्दा विषयहरूमाथि छलफल गरी निर्णय गर्न बाँकी विषयहरू नभएकोले उपस्थित सबै महानुभावहरूलाई धन्यवाद प्रदान गर्दै सभाका अध्यक्ष ज्यूले यस कम्पनीको सञ्चालक समितिको बैठकको विसर्जन भएको घोषणा गर्नुभयो ।"

# ── AGM minute ──
agm:
  intro: "आज मिति {agm} गते {agmTime} यस कम्पनीको वार्षिक साधारण सभाको बैठक यस कम्पनीका अध्यक्ष श्री {chair} को अध्यक्षतामा बैठक बसी तपसिल बमोजिमको महानुभावको उपस्थितिमा निम्नानुसारको निर्णय गरियो ।"
  quorumHead: "गणपूरक संख्या"
  quorumAll: "यस कम्पनीको नियमावलीको नियम बमोजिम सम्पूर्ण शेयरधनी स्वयं उपस्थित हुनुभई कम्पनी ऐन तथा यस कम्पनीको नियमावली बमोजिम सभा सञ्चालन गर्न आवश्यक गणपूरक संख्या पुगेको हुँदा सो बारेमा सभामा उपस्थित सबै शेयरधनीहरूलाई सभाको वैधानिकता बारे जानकारी गराउँदै मिति {agmBod} मा बोलाईएको यस कम्पनीको वार्षिक साधारण सभामा निम्न उल्लेखित प्रस्तावहरू उपर सभामा छलफल गरी निर्णय गर्न सभाको अध्यक्ष ज्यूले सभा सञ्चालन गर्नुभयो ।"
  quorumPartial: "कम्पनी ऐन, २०६३ तथा यस कम्पनीको नियमावली बमोजिम सभा सञ्चालन गर्न आवश्यक गणपूरक संख्या पुग्ने गरी शेयरधनीहरू उपस्थित भएको हुँदा सो बारेमा सभामा उपस्थित सबै शेयरधनीहरूलाई सभाको वैधानिकता बारे जानकारी गराउँदै मिति {agmBod} मा बोलाईएको यस कम्पनीको वार्षिक साधारण सभामा निम्न उल्लेखित प्रस्तावहरू उपर सभामा छलफल गरी निर्णय गर्न सभाको अध्यक्ष ज्यूले सभा सञ्चालन गर्नुभयो ।"
  prop1: "१. अध्यक्षद्वारा वार्षिक प्रतिवेदन प्रस्तुत गर्ने सम्बन्धमा ।"
  prop2: "२. आ.व. {fy} को वित्तीय विवरण तथा लेखापरीक्षण प्रतिवेदन सम्बन्धमा छलफल गरी पारित गर्ने सम्बन्धमा ।"
  prop3: "३. आ.व. {nextFy} को लेखापरीक्षक नियुक्ति गर्ने सम्बन्धमा ।"
  prop4: "४. विविध"
  dec1Head: "निर्णय नं. १. अध्यक्षद्वारा वार्षिक विवरण प्रस्तुत गर्ने सम्बन्धमा:"
  dec1: "प्रस्ताव नं. १ माथि छलफल गर्दा कम्पनीका अध्यक्षले प्रस्तुत गर्नुभएको वार्षिक प्रतिवेदन प्रति धन्यवाद दिने निर्णय गरियो ।"
  dec2Head: "निर्णय नं. २. गत वर्षको वित्तीय विवरण तथा लेखापरीक्षण प्रतिवेदन सम्बन्धमा छलफल गरी पारित गर्ने सम्बन्धमा:"
  dec2: "प्रस्ताव नं. २ माथि छलफल गर्दा कम्पनीका लेखापरीक्षक {curFirm} का श्री {curAuditor} ज्यूले यस सभा समक्ष प्रस्तुत गर्नुभएको आ.व. {fy} को लेखापरीक्षक प्रतिवेदन तथा आय व्यय विवरण र वासलात माथि छलफल भई समर्थन गर्ने निर्णय गरियो ।"
  dec3Head: "निर्णय नं. ३. आ.व. {nextFy} को लागि लेखापरीक्षक नियुक्ति गर्ने सम्बन्धमा:"
  dec3: "प्रस्ताव नं. ३ माथि छलफल गर्दा कम्पनी ऐन, २०६३ को दफा १११ बमोजिम आर्थिक वर्ष {nextFy} को लागि कम्पनीका लेखापरीक्षक {nextFirm} का श्री {nextAuditor} ज्यूलाई नियुक्ति गर्ने र पारिश्रमिकको हकमा लेखापरीक्षकज्यूको आपसी सहमतिमा निर्धारण गर्ने निर्णय गरियो ।"
  dec4Head: "निर्णय नं. ४ विविधः"
  dec4: "प्रस्ताव नं. ४ माथि छलफल गर्दा बैठकको अन्य विषय नहुनाले आजको बैठक यही समाप्त गर्ने निर्णय गरियो ।"

# ── Application letter (Section 50) ──
app50:
  to1: "श्रीमान कम्पनी रजिष्ट्रार ज्यू"
  to2: "कम्पनी रजिष्ट्रारको कार्यालय"
  to3: "त्रिपुरेश्वर, काठमाण्डौ"
  subject: "विषय :-दफा ५० (२) बमोजिमको कागजात पेश गरेको सम्बन्धमा ।"
  body: "उपरोक्त सम्बन्धमा यस कम्पनीको मिति {agm} मा बसेको वार्षिक साधारण सभा, उक्त सभाले गरेको निर्णयहरू र लेखापरीक्षकको आर्थिक वर्षको वार्षिक प्रतिवेदन र दफा ५१ को विवरण, कम्पनी ऐन, २०६३ को दफा ५० (२) को प्रयोजनको लागि पेश गरेका छौं । सोको अभिलेख गराई पाउँ ।"
  nibedak: "निवेदक"

# ── Section 92 (per director) ──
sec92:
  k: "क) कम्पनीको कारोबार संग सम्बन्धित कुनै प्रकारको खरिद बिक्री वा अन्य प्रकारको ठेक्का पट्टामा आफू वा आफ्नो निजकको नातेदारको प्रत्यक्ष संलग्नता भएमा वा कुनै किसिमको निजी स्वार्थ भएमा - {ans}"
  kh: "ख) कम्पनीको प्रबन्ध सञ्चालक, कम्पनी सचिव, पदाधिकारीको नियुक्तिको सम्बन्धमा कुनै प्रकारको स्वार्थ भएमा - {ans}"
  g: "ग) अन्य कुनै कम्पनीको सञ्चालक रहेमा- {ans}"
