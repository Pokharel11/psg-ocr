name: Deploy OCR app to Babal Host (FTP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Document root of the ocr.psgassociates.com.np subdomain.
          # cPanel's default when you create subdomain "ocr" is public_html/ocr.
          server-dir: public_html/ocr/
          # Don't upload repo/CI files to the web root.
          # config.php holds live DB credentials and must never be touched by a deploy.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            config.php
